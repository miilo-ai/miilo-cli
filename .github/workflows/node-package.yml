name: Node package
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/miilo-cli-node
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 20.19
        cache: npm
        cache-dependency-path: packages/miilo-cli-node/package-lock.json
    - run: npm ci --ignore-scripts
    - run: npm run check
    - run: npm test
    - run: npm pack
    - run: ../../scripts/test-node-package.sh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: miilo-node-package
        path: packages/miilo-cli-node/*.tgz
        if-no-files-found: error
'on':
  workflow_dispatch: null
