name: Candidate qualification
'on':
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    secrets:
      MIILO_SDK_READ_TOKEN:
        required: false
      MIILO_WORKSPACE_READ_TOKEN:
        required: false
    outputs:
      ready:
        value: ${{ jobs.qualify.outputs.ready }}
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '2'
    outputs:
      ready: ${{ steps.result.outputs.ready }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - name: Architecture boundary gate
      run: python3 tools/check_architecture.py && python3 tools/test_architecture.py
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - run: python -m pip install -r .github/release-tools/requirements.txt
    - run: python .github/release-tools/lint_workflows.py
    - run: python -m unittest discover -s .github/release-tools -p "test_*.py" -v
    - run: python .github/release-tools/version.py --tag "$RELEASE_TAG"
      env:
        RELEASE_TAG: ${{ startsWith(inputs.ref, 'refs/tags/') && inputs.ref || startsWith(inputs.ref, 'v') && inputs.ref ||
          '' }}
    - uses: ./.github/actions/sdk-access
      id: sdk
      with:
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN || secrets.MIILO_WORKSPACE_READ_TOKEN)
          || '' }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: 1.96.1
        components: rustfmt, clippy
    - run: node scripts/check-release-config.mjs
    - run: npm ci --ignore-scripts && npm test
      working-directory: packages/miilo-cli-node
    - run: scripts/test-node-package.sh
    - run: python scripts/package-agent-plugin.py
    - run: cargo fmt --all --check
    - run: 'cargo clippy --workspace --all-targets --locked -- -D warnings

        cargo test --workspace --locked

        cargo build --workspace --locked'
      if: steps.sdk.outputs.ready == 'true'
    - run: scripts/smoke.sh
      if: steps.sdk.outputs.ready == 'true'
    - run: echo "ready=$READY" >> "$GITHUB_OUTPUT"
      id: result
      env:
        READY: ${{ steps.sdk.outputs.ready }}
