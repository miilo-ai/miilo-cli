[workspace]
resolver = "3"
members = ["crates/miilo-client", "crates/miilo-cli", "crates/miilo-local"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/miilo-ai/miilo-cli"
homepage = "https://miilo.tech"
authors = ["Miilo contributors"]
publish = false

[workspace.dependencies]
miilo-adapter-sdk = { git = "https://github.com/miilo-ai/miilo-sdk", rev = "40c2008207ae8abac2b82eeca7511ad6bf665d35" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# The generated workflow is intentionally extended with the tested Node package.
# Keep dist responsible for artifacts while preserving that custom release job.
allow-dirty = ["ci", "msi"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A GitHub repo to push Homebrew formulas to
tap = "miilo-ai/miilo-homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Custom message to display on successful install
install-success-msg = "Miilo is installed. Run `miilo doctor` to verify your connection."
# Whether to enable GitHub Attestations
github-attestations = true
github-custom-runners = { aarch64-unknown-linux-gnu = "ubuntu-24.04-arm" }
# Whether to install an updater program
install-updater = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
