name: Node and agent payloads
'on':
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 20.19
        cache: npm
        cache-dependency-path: packages/miilo-cli-node/package-lock.json
    - run: npm ci --ignore-scripts
      working-directory: packages/miilo-cli-node
    - run: npm test
      working-directory: packages/miilo-cli-node
    - run: npm pack --pack-destination ../../target/distrib
      working-directory: packages/miilo-cli-node
    - run: |-
        python scripts/package-agent-plugin.py
        (cd target/distrib && sha256sum *.tgz *.zip > NODE-AND-SKILL-SHA256SUMS)
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      if: github.event.repository.private == false
      with:
        subject-path: target/distrib/*
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-node-package
        path: target/distrib/*
        if-no-files-found: error
    permissions:
      contents: read
      id-token: write
      attestations: write
