name: Release
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ inputs.tag || github.ref_name }}
      tag-flag: ${{ format('--tag={0}', inputs.tag || github.ref_name) }}
      publishing: 'true'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: ./.github/actions/sdk-access
      with:
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN || secrets.MIILO_WORKSPACE_READ_TOKEN)
          || '' }}
    - name: Install dist
      shell: bash
      run: python .github/release-tools/install-dist.py
    - name: Cache dist
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cargo-dist-cache
        path: ${{ runner.temp }}/miilo-tools/dist
    - id: plan
      run: |-
        dist host --steps=create --tag "$TAG" --output-format=json > plan-dist-manifest.json
        cat plan-dist-manifest.json
        echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
    - name: Upload dist-manifest.json
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-plan-dist-manifest
        path: plan-dist-manifest.json
    needs:
    - qualify
    - publication-gate
    if: needs.publication-gate.outputs.publish == 'true'
    permissions:
      contents: write
  build-node-package:
    needs:
    - plan
    if: needs.plan.outputs.publishing == 'true'
    uses: ./.github/workflows/build-node-payload.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: read
      id-token: write
      attestations: write
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
    - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing
      == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
    - name: enable windows longpaths
      run: |
        git config --global core.longpaths true
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: ./.github/actions/sdk-access
      with:
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN || secrets.MIILO_WORKSPACE_READ_TOKEN)
          || '' }}
    - name: Install Rust non-interactively if not already installed
      if: ${{ matrix.container }}
      run: |
        if ! command -v cargo > /dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi
    - name: Install dist
      run: python .github/release-tools/install-dist.py
    - name: Fetch local artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - name: Install dependencies
      run: |
        ${{ matrix.packages_install }}
    - name: Build artifacts
      run: |
        # Actually do builds and make zips and whatnot
        dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
        echo "dist ran successfully"
    - name: Test the installed native archive
      shell: bash
      run: python .github/release-tools/check-native-artifact.py
      env:
        TARGETS: ${{ join(matrix.targets, ',') }}
    - name: Attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: target/distrib/*${{ join(matrix.targets, ', ') }}*
      if: github.event.repository.private == false
    - id: cargo-dist
      name: Post-build
      shell: bash
      run: |
        # Parse out what we just built and upload it to scratch storage
        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        cp dist-manifest.json "$BUILD_MANIFEST_NAME"
    - name: Verify Windows MSI installation and removal
      if: contains(matrix.targets, 'x86_64-pc-windows-msvc')
      shell: pwsh
      run: ./.github/release-tools/check-windows-installer.ps1
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-build-local-${{ join(matrix.targets, '_') }}
        path: |
          ${{ steps.cargo-dist.outputs.paths }}
          ${{ env.BUILD_MANIFEST_NAME }}
  build-global-artifacts:
    needs:
    - plan
    - build-local-artifacts
    - build-node-package
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: ./.github/actions/sdk-access
      with:
        token: ${{ github.event_name != 'pull_request' && (secrets.MIILO_SDK_READ_TOKEN || secrets.MIILO_WORKSPACE_READ_TOKEN)
          || '' }}
    - name: Install cached dist
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-dist-cache
        path: ${{ runner.temp }}/miilo-tools/
    - run: |-
        chmod +x "$RUNNER_TEMP/miilo-tools/dist"
        echo "$RUNNER_TEMP/miilo-tools" >> "$GITHUB_PATH"
    - name: Fetch local artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - id: cargo-dist
      shell: bash
      run: |
        dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
        echo "dist ran successfully"

        # Parse out what we just built and upload it to scratch storage
        echo "paths<<EOF" >> "$GITHUB_OUTPUT"
        jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

        cp dist-manifest.json "$BUILD_MANIFEST_NAME"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-build-global
        path: |
          ${{ steps.cargo-dist.outputs.paths }}
          ${{ env.BUILD_MANIFEST_NAME }}
  host:
    needs:
    - plan
    - build-local-artifacts
    - build-global-artifacts
    - build-node-package
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.build-node-package.result
      == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success')
      && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
        ref: ${{ inputs.tag || github.ref }}
    - name: Install cached dist
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-dist-cache
        path: ${{ runner.temp }}/miilo-tools/
    - run: |-
        chmod +x "$RUNNER_TEMP/miilo-tools/dist"
        echo "$RUNNER_TEMP/miilo-tools" >> "$GITHUB_PATH"
    - name: Fetch artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: target/distrib/
        merge-multiple: true
    - id: host
      shell: bash
      run: |
        dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
        echo "artifacts uploaded and released successfully"
        cat dist-manifest.json
        echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
    - name: Upload dist-manifest.json
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-dist-manifest
        path: dist-manifest.json
    - name: Download GitHub Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: artifacts-*
        path: artifacts
        merge-multiple: true
    - name: Cleanup
      run: |
        # Remove the granular manifests
        rm -f artifacts/*-dist-manifest.json
    - name: Create GitHub Release
      env:
        PRERELEASE_FLAG: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}
        ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
        ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        # Write and read notes from a file to avoid quoting breaking things
        python .github/release-tools/release_notes.py "$RUNNER_TEMP/notes.txt"

        gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
    permissions:
      contents: write
    environment: release
  publish-homebrew-formula:
    needs:
    - plan
    - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases
      }}
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    secrets: inherit
  announce:
    needs:
    - plan
    - host
    - publish-homebrew-formula
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result
      == 'success') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        submodules: recursive
        ref: ${{ inputs.tag || github.ref }}
  qualify:
    uses: ./.github/workflows/qualify.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit
  publication-gate:
    needs: qualify
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ inputs.tag || github.ref }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - run: python .github/release-tools/version.py --tag "$TAG"
      env:
        TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    - name: Publishing requires the exact tag workflow context
      if: inputs.publish == true || vars.MIILO_RELEASE_ENABLED == 'true'
      shell: bash
      run: test "$GITHUB_REF" = "refs/tags/$TAG" || { echo "Run the release workflow from its version tag, not another branch"
        >&2; exit 1; }
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
    - id: existing
      run: python .github/release-tools/release_exists.py
      env:
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    - id: policy
      run: python .github/release-tools/publication.py
      env:
        MIILO_RELEASE_ENABLED: ${{ vars.MIILO_RELEASE_ENABLED }}
        MIILO_PUBLISH: ${{ inputs.publish }}
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEPENDENCIES_READY: ${{ needs.qualify.outputs.ready == 'true' && steps.existing.outputs.exists != 'true' }}
  no-release:
    needs:
    - qualify
    - publication-gate
    - host
    if: always() && needs.host.result != 'success'
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo "No release has been made"
        echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"
'on':
  pull_request: null
  push:
    tags:
    - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Existing version tag matching the manifests
      publish:
        type: boolean
        default: false
        description: Authorize GitHub Release publication
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
