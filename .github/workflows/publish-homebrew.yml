name: Homebrew update pull request
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: Published stable CLI tag to import into the tap
permissions:
  contents: read
concurrency:
  group: homebrew-formula-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: homebrew
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      PLAN: ${{ inputs.plan }}
      RELEASE_TAG: ${{ inputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SOURCE_PRIVATE: ${{ github.event.repository.private }}
    defaults:
      run:
        shell: bash
        working-directory: tap
    steps:
    - id: credentials
      name: Require tap publishing credential
      working-directory: .
      run: |
        set -euo pipefail
        if [ -z "$TAP_TOKEN" ]; then
          echo "::error::HOMEBREW_TAP_TOKEN is missing. Configure tap Contents and Pull requests read/write access. Existing CLI releases are unchanged."
          exit 1
        fi
        if [ "$SOURCE_PRIVATE" = true ]; then
          echo "::error::Homebrew publication requires the public CLI repository."
          exit 1
        fi
        echo "ready=true" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      if: steps.credentials.outputs.ready == 'true'
      with:
        repository: miilo-ai/homebrew-cli
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        persist-credentials: true
        ref: main
        fetch-depth: 0
        path: tap
    - name: Validate version and tap branch access
      id: target
      if: steps.credentials.outputs.ready == 'true'
      run: |
        set -euo pipefail
        args=(--plan)
        if [ -n "$RELEASE_TAG" ]; then args=(--tag "$RELEASE_TAG"); fi
        tag=$(python3 tools/publish_formula_pr.py "${args[@]}" --print-tag)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        python3 tools/publish_formula_pr.py --tag "$tag" --preflight
    - name: Fetch generated formula artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      if: steps.credentials.outputs.ready == 'true' && inputs.plan != ''
      with:
        path: tap/Formula/
        merge-multiple: true
        name: artifacts-build-global
    - name: Fetch existing published release formula
      if: steps.credentials.outputs.ready == 'true' && inputs.plan == ''
      env:
        TAG: ${{ steps.target.outputs.tag }}
      run: gh release download "$TAG" --repo miilo-ai/miilo-cli --pattern miilo.rb --dir Formula --clobber
    - name: Prepare review branch
      id: prepare
      if: steps.credentials.outputs.ready == 'true'
      env:
        TAG: ${{ steps.target.outputs.tag }}
      run: |
        set -euo pipefail
        export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
        git config user.name 'Miilo release automation'
        git config user.email 'release@users.noreply.github.com'
        python3 tools/prepare_formula.py Formula/miilo.rb "$TAG"
        brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix Formula/miilo.rb
        python3 tools/publish_formula_pr.py --tag "$TAG" --prepare
    - name: Audit and exercise generated formula
      if: steps.prepare.outputs.changed == 'true'
      run: |
        set -euo pipefail
        export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
        brew tap miilo-ai/cli "$GITHUB_WORKSPACE/tap"
        brew audit --strict miilo-ai/cli/miilo
        brew install miilo-ai/cli/miilo
        brew test miilo-ai/cli/miilo
        bash tools/test-archive-install.sh "$(brew --prefix miilo-ai/cli/miilo)/bin/miilo"
        "$(brew --prefix miilo-ai/cli/miilo)/bin/miilo-local" --version
        brew uninstall miilo-ai/cli/miilo
    - name: Open or reuse formula update PR
      if: steps.prepare.outputs.changed == 'true'
      env:
        TAG: ${{ steps.target.outputs.tag }}
      run: python3 tools/publish_formula_pr.py --tag "$TAG"
