[package]
name = "miilo-telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit, bounded telemetry host for Miilo applications"

[dependencies]
miilo-adapter-sdk = { workspace = true, features = ["telemetry"] }
chrono = "0.4"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"

[dev-dependencies]
serde_json = "1"
