name: Optional Homebrew publishing
'on':
  workflow_call:
    inputs:
      plan:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAN: ${{ inputs.plan }}
      GITHUB_USER: axo bot
      GITHUB_EMAIL: admin+bot@axo.dev
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SOURCE_PRIVATE: ${{ github.event.repository.private }}
    steps:
    - id: credentials
      name: Optional tap publishing credential
      run: |-
        if [ -z "$TAP_TOKEN" ] || [ "$SOURCE_PRIVATE" = true ]; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "No release has been made"
          echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: true
        repository: miilo-ai/homebrew-cli
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        ref: main
      if: steps.credentials.outputs.ready == 'true'
    - name: Fetch homebrew formulae
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: Formula/
        merge-multiple: true
        name: artifacts-build-global
      if: steps.credentials.outputs.ready == 'true'
    - name: Commit formula files
      run: |
        set -euo pipefail
        git config user.name "$GITHUB_USER"
        git config user.email "$GITHUB_EMAIL"
        export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
        changed=0
        names=()
        for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
          filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
          name=${filename%.rb}
          version=$(echo "$release" | jq .app_version --raw-output)
          brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/$filename"
          git add "Formula/$filename"
          if git diff --cached --quiet; then continue; fi
          git commit -m "$name $version"
          names+=("$name")
          changed=1
        done
        if [ "$changed" = 0 ]; then
          echo 'No release has been made'
          echo 'No release has been made' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        brew tap miilo-ai/cli "$GITHUB_WORKSPACE"
        for name in "${names[@]}"; do
          brew audit --strict "miilo-ai/cli/$name"
          brew install "miilo-ai/cli/$name"
          brew test "miilo-ai/cli/$name"
          "$name" --version
          if [ "$name" = miilo ]; then
            "$(brew --prefix "miilo-ai/cli/$name")/bin/miilo-local" --version
          fi
          brew uninstall "miilo-ai/cli/$name"
        done
        git push
      if: steps.credentials.outputs.ready == 'true'
    permissions:
      contents: read
    environment: homebrew
