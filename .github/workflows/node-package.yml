name: Node package
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/miilo-cli-node
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20.19
        cache: npm
        cache-dependency-path: packages/miilo-cli-node/package-lock.json
    - run: npm ci --ignore-scripts
    - run: npm run check
    - run: npm test
    - run: npm pack
    - run: ../../scripts/test-node-package.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: miilo-node-package
        path: packages/miilo-cli-node/*.tgz
        if-no-files-found: error
'on':
  workflow_dispatch: null
