[package]
name = "miilo-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Standalone read-only local session observation engine"
[dependencies]
miilo-adapter-sdk = { workspace = true, features = ["runtime", "compression"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
chrono = "0.4"
sha2 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
tempfile = "3"
fs2 = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "zstd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
