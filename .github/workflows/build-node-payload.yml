name: Node and agent payloads
'on':
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        ref: ${{ inputs.ref }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20.19
        cache: npm
        cache-dependency-path: packages/miilo-cli-node/package-lock.json
    - run: npm ci --ignore-scripts
      working-directory: packages/miilo-cli-node
    - run: npm test
      working-directory: packages/miilo-cli-node
    - run: |
        mkdir -p ../../target/distrib
        npm pack --pack-destination ../../target/distrib
      working-directory: packages/miilo-cli-node
    - run: |-
        python scripts/package-agent-plugin.py
        (cd target/distrib && sha256sum *.tgz *.zip > NODE-AND-SKILL-SHA256SUMS)
    - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      if: github.event.repository.private == false
      with:
        subject-path: target/distrib/*
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: artifacts-node-package
        path: target/distrib/*
        if-no-files-found: error
    permissions:
      contents: read
      id-token: write
      attestations: write
