name: Version and tag
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Authorize candidate tagging and release dispatch
permissions:
  contents: read
concurrency:
  group: version-main
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new_version }}
      publish: ${{ steps.policy.outputs.publish }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python .github/release-tools/version.py
      id: version
    - id: policy
      run: python .github/release-tools/publication.py
      env:
        MIILO_RELEASE_ENABLED: ${{ vars.MIILO_RELEASE_ENABLED }}
        MIILO_PUBLISH: ${{ inputs.publish }}
        RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEPENDENCIES_READY: 'true'
  qualify:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true' && needs.candidate.outputs.new == 'true'
    uses: ./.github/workflows/qualify.yml
    secrets: inherit
  tag:
    needs:
    - candidate
    - qualify
    if: needs.qualify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    environment: release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Create matching tag and explicitly dispatch release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.candidate.outputs.tag }}
      run: |-
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        gh auth setup-git
        if git show-ref --verify --quiet "refs/tags/$TAG"; then
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
        else
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
        fi
        gh workflow run release.yml --ref "$TAG" -f tag="$TAG" -f publish=true
  unchanged:
    needs:
    - candidate
    - qualify
    - tag
    if: always() && needs.tag.result != 'success'
    runs-on: ubuntu-latest
    steps:
    - run: |-
        echo "No release has been made" >> "$GITHUB_STEP_SUMMARY"
        echo "No release has been made"
