name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/miilo-cli-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: packages/miilo-cli-node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run

  smoke:
    runs-on: ubuntu-latest
    needs: [rust, node]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: packages/miilo-cli-node/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: packages/miilo-cli-node
      - run: npm run build
        working-directory: packages/miilo-cli-node
      - run: cargo build --workspace --locked
      - run: scripts/smoke.sh
